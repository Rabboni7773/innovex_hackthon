<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 240px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .user-info {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .user-name {
      font-weight: 600;
      color: #0f172a;
    }
    .btn-edit {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-edit:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <h3>Form Shield</h3>
  <div class="user-info" id="userStatus">Checking profile...</div>
  
  <button id="editProfileBtn" class="btn-edit">
    ⚙️ Edit Profile
  </button>

  <script src="popup.js"></script>
</body>
</html>
